const NUCS=[
 {t:"Prólogo · El gesto de acumular",tesis:"Antes de preguntar qué hacemos con la basura, el museo muestra el gesto que la vuelve visible: acumular. Un objeto repetido hasta la saturación deja de ser mercancía y se convierte en retrato de una época."},

 {t:"Epílogo · Nosotros, el residuo",tesis:"La multitud de figuras hechas de desechos invierte la mirada: el espectador deja de observar la basura y es observado por ella. Lo que produce el consumo también nos representa."}

{titulo:"Venere degli stracci",artista:"Michelangelo Pistoletto",anio:"1967",nucleo:1,individual:false,

{titulo:"Nine",artista:"Guerra de la Paz",anio:"ca. 2007",nucleo:1,individual:true,
 tecnica:"Ropa y textiles reciclados (verificar técnica, soporte, medidas y colección)",
 corto:"Ropa usada convertida en imagen. Los artistas cubanos radicados en Miami trabajan con prendas desechadas que conservan la huella de los cuerpos que las vistieron.",
 largo:"Alain Guerra y Neraldo de la Paz, artistas de origen cubano radicados en Miami, trabajan en dupla desde los años noventa (verificar año) con ropa y textiles reciclados. Nine, hacia 2007, pertenece a esa práctica: la prenda descartada, que ya perdió su valor de moda, se reordena hasta formar una imagen. El procedimiento (verificar técnica exacta de esta pieza) importa tanto como el resultado, porque cada tela conserva color, desgaste y memoria corporal. Desde la sociología, la ropa es el consumo más rápido y visible: Bauman describe la «vida líquida» como un ciclo de comprar, usar y reemplazar sin pausa. Aquí el ciclo se detiene y la prenda recupera una segunda vida simbólica. Para nuestro tema, la obra muestra lo desechable como material con historia: no hay residuo sin cuerpo previo. Su lugar en el Núcleo 1 aclara la tesis: la belleza no se inventa, se rescata de lo que otros dejaron."},
{titulo:"Gravity and Grace",artista:"El Anatsui",anio:"2010",nucleo:1,individual:false,

 corto:"Miles de tapas de botella unidas con alambre forman un tapiz que brilla como tela ceremonial. El artista ghanés transforma el desecho del alcohol industrial en una arquitectura flexible y monumental.",largo:""},
{titulo:"Marat (Sebastião)",artista:"Vik Muniz",anio:"2008 (verificar)",nucleo:2,individual:false,
 tecnica:"Fotografía de una composición hecha con material reciclable, serie Pictures of Garbage (verificar formato)",
 corto:"Retrato de un recolector del vertedero de Jardim Gramacho, en Río de Janeiro, compuesto con basura y evocando el Marat de David. La persona que vive del desecho se vuelve figura histórica.",largo:""},
{titulo:"Touch Sanitation Performance",artista:"Mierle Laderman Ukeles",anio:"1979–1980",nucleo:2,individual:true,
 tecnica:"Performance de largo aliento: apretón de manos y agradecimiento a cada trabajador (verificar cifras exactas)",
 corto:"Durante cerca de un año, Ukeles saludó personalmente a miles de recolectores de Nueva York. Hizo visible el trabajo que sostiene la ciudad y que el consumo prefiere no ver.",
 largo:"Mierle Laderman Ukeles redactó en 1969 el «Manifiesto del Arte de Mantenimiento», que pone en el centro las tareas repetitivas que mantienen la vida: limpiar, cuidar, recoger. Desde 1977 trabaja como artista residente del Departamento de Sanidad de Nueva York (verificar condiciones). Entre 1979 y 1980 realizó Touch Sanitation Performance: recorrió los distritos de la ciudad y estrechó la mano de miles de trabajadores sanitarios, agradeciéndoles por mantener viva la ciudad. La técnica es el encuentro: sin objeto ni escenario, el gesto es la obra. Su lectura filosófica conecta con Mary Douglas, para quien la suciedad es «materia fuera de lugar», y con Bauman, que muestra cómo la modernidad aparta los residuos, y a quienes los manejan, fuera de la vista. Para nuestro tema, esta es la obra que revela lo oculto: la ciudad limpia es una ilusión sostenida por trabajo invisible. Antes de cualquier montaña de basura hay manos que la mueven, y Ukeles les devuelve rostro y nombre."},
{titulo:"Waste Not",artista:"Song Dong",anio:"2005",nucleo:2,individual:false,
 tecnica:"Instalación con más de diez mil objetos domésticos acumulados (verificar cifra y colección)",

{titulo:"Midway: Message from the Gyre",artista:"Chris Jordan",anio:"2009–",nucleo:3,individual:true,

 largo:"Chris Jordan, fotógrafo estadounidense, viajó desde 2009 al atolón de Midway, en el Pacífico Norte, para registrar las crías de albatros muertas tras ser alimentadas con plástico que sus padres recogían del mar creyéndolo alimento. Las imágenes muestran los cuerpos descompuestos y, dentro de ellos, tapas, encendedores y fragmentos que ya no pueden digerirse. El artista afirma no haber manipulado la escena (verificar declaración y fechas del proyecto). La técnica es la fotografía documental, con una frialdad casi forense que evita el sentimentalismo. Filosóficamente, la serie plantea la escala del Antropoceno: un objeto usado minutos queda durante siglos y atraviesa especies, océanos y generaciones. Para el tema, es el contrapunto del Prólogo: Arman acumulaba objetos en una vitrina, aquí la acumulación ocurre dentro de la naturaleza. Lo desechable no desaparece, solo cambia de lugar hasta volverse irreversible."},
{titulo:"Untitled (Plastic Cups)",artista:"Tara Donovan",anio:"2006",nucleo:3,individual:false,

const ENDING={

/* ============ ESCENA ============ */
const D=14,W=16,H=5,NR=9;
const ROOMS=["Prólogo","Núcleo 1","Núcleo 1 · obra en foco","Núcleo 2","Núcleo 2 · obra en foco","Núcleo 3","Núcleo 3 · obra en foco","Epílogo","Cierre"];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x14130f);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);cam.rotation.order='YXZ';
const rend=new THREE.WebGLRenderer({antialias:true});rend.setPixelRatio(Math.min(devicePixelRatio,1.5));
rend.setSize(innerWidth,innerHeight);rend.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(rend.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x777066,.55));
const mix=(a,b,t)=>new THREE.Color(a).lerp(new THREE.Color(b),t);
for(let i=0;i<NR;i++){
 const t=i/(NR-1),z0=-i*D,zc=z0-D/2;
 const foco=[2,4,6].includes(i),wc=foco?new THREE.Color(0x26231f):mix(0xf5f3ee,0x8a857c,t),fc=foco?new THREE.Color(0x121110):mix(0xe4e0d8,0x4b4741,t);
 const wm=new THREE.MeshLambertMaterial({color:wc});
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshLambertMaterial({color:fc}));fl.rotation.x=-Math.PI/2;fl.position.set(0,0,zc);scene.add(fl);
 const ce=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshLambertMaterial({color:foco?0x0d0c0b:mix(0xffffff,0x6d6961,t)}));ce.rotation.x=Math.PI/2;ce.position.set(0,H,zc);scene.add(ce);
 [-1,1].forEach(s=>{const w=new THREE.Mesh(new THREE.BoxGeometry(.3,H,D),wm);w.position.set(s*W/2,H/2,zc);scene.add(w)});
 const box=(w,h,x,y)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.3),wm);m.position.set(x,y,z0);scene.add(m)};
 if(i==0)box(W,H,0,H/2);else{box(6,H,-5,H/2);box(6,H,5,H/2);box(4,H-3.2,0,3.2+(H-3.2)/2)}
 if(i==NR-1){const m=new THREE.Mesh(new THREE.BoxGeometry(W,H,.3),wm);m.position.set(0,H/2,z0-D);scene.add(m)}
 if(foco){const l=new THREE.PointLight(0xffd9a0,.2,16);l.position.set(0,H-.6,zc);scene.add(l);const sp=new THREE.SpotLight(0xffe2b0,1.6,22,.5,.5,1);sp.position.set(-2,H-.2,zc);sp.target.position.set(W/2,2.5,zc);scene.add(sp,sp.target)}else{const l=new THREE.PointLight(mix(0xfff4e0,0xc9c2b4,t),.75,24);l.position.set(0,H-.6,zc);scene.add(l)}
 /* acumulación creciente */
 if(i>0){const n=i*7,m=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial(),n),d=new THREE.Object3D(),c=new THREE.Color();
  for(let k=0;k<n;k++){const s=.15+Math.random()*.4,sd=Math.random()<.5?-1:1;d.position.set(sd*(4.6+Math.random()*2.9),s*.3,z0-1.2-Math.random()*(D-2.4));d.rotation.y=Math.random()*3;d.scale.set(s*(.6+Math.random()),s*(.5+Math.random()),s);d.updateMatrix();m.setMatrixAt(k,d.matrix);m.setColorAt(k,c.setHSL(.08+Math.random()*.08,.15,.25+Math.random()*.4))}
  scene.add(m)}
}
/* figuras del Epílogo */
const fm=new THREE.MeshLambertMaterial({color:0x7a756b});
for(let k=0;k<14;k++){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(.5,1.1,.3),fm),h=new THREE.Mesh(new THREE.BoxGeometry(.28,.3,.28),fm);b.position.y=.8;h.position.y=1.5;g.add(b,h);
 g.position.set(-6.6+Math.random()*4.1,0,-7*D-1.5-Math.random()*(D-3));g.rotation.y=.6+Math.random()*.8;g.scale.setScalar(.9+Math.random()*.25);scene.add(g)}

/* texturas y obras */
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}

const pics=[],FR=new THREE.MeshLambertMaterial({color:0x15130f}),groups={};
OBRAS.forEach((o,k)=>{o.n=k+1;o.room=o.individual?{1:2,2:4,3:6}[o.nucleo]:[0,1,3,5,7][o.nucleo];(groups[o.room]=groups[o.room]||[]).push(o)});
Object.values(groups).forEach(list=>list.forEach((o,j)=>{
 const big=o.individual,w=big?5.2:2.6,h=big?3.6:1.9,side=big||list.length==1?1:(j%2?1:-1),zc=-o.room*D-D/2,y=big?2.5:2.3;
 const g=new THREE.Group();g.position.set(side*(W/2-.16),y,zc);g.rotation.y=side==1?-Math.PI/2:Math.PI/2;scene.add(g);
 if(big){const bk=new THREE.Mesh(new THREE.PlaneGeometry(w+3,4.6),new THREE.MeshLambertMaterial({color:0x1f1d1a}));bk.position.z=.01;g.add(bk)}
 const fr=new THREE.Mesh(new THREE.BoxGeometry(w+.3,h+.3,.12),FR);fr.position.z=.06;g.add(fr);

 const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex}));p.position.z=.125;p.userData={o,w,h};g.add(p);pics.push(p);o.pic=p;
 const ct=new THREE.Mesh(new THREE.PlaneGeometry(1.5,.6),new THREE.MeshBasicMaterial({map:cv(512,205,c=>{c.fillStyle='#efece6';c.fillRect(0,0,512,205);c.fillStyle='#1b1a18';c.font='bold 30px Georgia';const e=wrap(c,o.titulo,20,48,470,34);c.font='italic 26px Georgia';c.fillText(o.artista,20,e+36);c.font='24px Georgia';c.fillText(o.anio,20,e+68)})}));

}));
/* placa de cierre */
{const g=new THREE.Group();g.position.set(W/2-.16,2.3,-8*D-D/2);g.rotation.y=-Math.PI/2;scene.add(g);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(3,1.5),new THREE.MeshBasicMaterial({map:cv(512,256,c=>{c.fillStyle='#e9e4da';c.fillRect(0,0,512,256);c.fillStyle='#1b1a18';c.textAlign='center';c.font='bold 38px Georgia';c.fillText('CIERRE',256,90);c.font='26px Georgia';c.fillText('Conclusión curatorial,',256,150);c.fillText('créditos y bibliografía',256,186);c.font='italic 20px Georgia';c.fillText('(clic para leer)',256,230)})}));
 m.userData={cierre:1};g.add(m);pics.push(m)}

/* ============ NAVEGACIÓN ============ */
const P={x:0,z:-1.5,yaw:0,pitch:0};let tw=null;
function fly(x,z,yaw,pitch=0,dur=1.3){let dy=yaw-P.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));tw={t:0,dur,x0:P.x,z0:P.z,y0:P.yaw,dy,p0:P.pitch,x1:x,z1:z,p1:pitch}}
const goRoom=i=>fly(0,-i*D-2,0);
const goObra=o=>{fly(o.fly.x,o.fly.z,o.fly.yaw);showObra(o)};
const menu=$('menu'),btns=[];
function addB(label,fn,room){const b=document.createElement('button');b.textContent=label;b.onclick=fn;menu.appendChild(b);btns.push({b,room})}
function addT(t){const d=document.createElement('div');d.className='t';d.textContent=t;menu.appendChild(d)}
addT('RECORRIDO');
addB('Portada',()=>{$('cover').style.display='flex'},-1);
addB('Prólogo',()=>{goRoom(0);showNuc(0)},0);
[[1,1,2],[2,3,4],[3,5,6]].forEach(([n,sr,fr])=>{
 addB('Núcleo '+n,()=>{goRoom(sr);showNuc(n)},sr);
 const o=OBRAS.find(x=>x.individual&&x.nucleo==n);addB('★ '+o.artista,()=>goObra(o),fr)});
addB('Epílogo',()=>{goRoom(7);showNuc(4)},7);
addB('Cierre',()=>{goRoom(8);showEnd()},8);
const ld=document.createElement('button');ld.id='load';ld.textContent='Cargar imágenes';ld.onclick=()=>$('files').click();menu.appendChild(ld);
$('files').onchange=e=>{let ok=0;[...e.target.files].forEach(f=>{const m=parseInt(f.name,10);const o=OBRAS[m-1];if(!o)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const t=new THREE.Texture(im);t.encoding=THREE.sRGBEncoding;t.needsUpdate=true;const p=o.pic,{w,h}=p.userData,r2=im.width/im.height,a=w/h;p.material.map=t;p.material.needsUpdate=true;if(r2>a)p.scale.set(1,a/r2,1);else p.scale.set(r2/a,1,1)};im.src=r.result};r.readAsDataURL(f);ok++});
 alert(ok+' imagen(es) asignada(s). Los archivos deben empezar con el número de la obra (01-arman.jpg, 02-pistoletto.jpg, …).');e.target.value=''};

/* teclado y mouse */
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
let drag=false,moved=0,lx=0,ly=0;const cvs=rend.domElement;
cvs.onmousedown=e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY};
addEventListener('mouseup',e=>{if(drag&&moved<5&&e.target==cvs)pick(e);drag=false});
addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);lx=e.clientX;ly=e.clientY;P.yaw-=dx*.003;P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-dy*.003));tw=null});
const rc=new THREE.Raycaster();
function pick(e){rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
 const h=rc.intersectObjects(pics)[0];if(!h)return;const u=h.object.userData;if(u.cierre){showEnd();return}goObra(u.o)}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rend.setSize(innerWidth,innerHeight)});

/* bucle */
let last=performance.now(),curRoom=-1;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if($('cover').style.display!='none'){P.yaw+=dt*.05}
 else{
  const f=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0),s=(K.KeyD?1:0)-(K.KeyA?1:0),tr=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0);
  if(tr){P.yaw-=tr*dt*1.8;tw=null}
  if(f||s){tw=null;const v=(K.ShiftLeft||K.ShiftRight?7:3.8)*dt,sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
   let nx=P.x+(-sy*f+cy*s)*v,nz=P.z+(-cy*f-sy*s)*v;
   nx=Math.max(-7.3,Math.min(7.3,nx));
   for(let i=1;i<NR;i++){const zw=-i*D;if(((P.z-zw)*(nz-zw)<0||Math.abs(nz-zw)<.4)&&Math.abs(nx)>1.7){nz=P.z}}
   nz=Math.max(-NR*D+.6,Math.min(-.6,nz));P.x=nx;P.z=nz}
  if(tw){tw.t+=dt;const k=Math.min(1,tw.t/tw.dur),e=k*k*(3-2*k);P.x=tw.x0+(tw.x1-tw.x0)*e;P.z=tw.z0+(tw.z1-tw.z0)*e;P.yaw=tw.y0+tw.dy*e;P.pitch=tw.p0+(tw.p1-tw.p0)*e;if(k==1)tw=null}
 }
 cam.position.set(P.x,1.65,P.z);cam.rotation.set(P.pitch,P.yaw,0);
 const r=Math.max(0,Math.min(NR-1,Math.floor(-P.z/D)));
 if(r!=curRoom){curRoom=r;$('room').textContent=ROOMS[r];btns.forEach(x=>x.b.classList.toggle('on',x.room==r))}
 rend.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
